<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ජීවනසවිය · Jeewanasaviya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Pre-JS boot screen (removed automatically when the app renders). */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff; }
      .boot-bar { position: fixed; inset: 0 0 auto; height: 3px; overflow: hidden; background: #faedc6; }
      .boot-bar span { display: block; height: 100%; width: 33%; background: linear-gradient(90deg, #ecc155, #c99227, #ecc155); animation: boot-progress 1.1s cubic-bezier(.4,0,.2,1) infinite; }
      .boot-mark { position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center; }
      .boot-ring { position: absolute; inset: 0; border-radius: 9999px; border: 3px solid #e4eaf6; border-top-color: #c99227; border-right-color: #e0aa36; animation: boot-spin .9s linear infinite; }
      .boot-mark img { width: 70px; height: 70px; object-fit: contain; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-name { margin: 0; font: 700 15px 'Noto Sans Sinhala', sans-serif; color: #13224a; letter-spacing: .02em; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-progress { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(.94); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .boot-ring, .boot-bar span, .boot-mark img { animation: none; } }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-bar"><span></span></div>
        <div class="boot-mark">
          <span class="boot-ring"></span>
          <img src="/brand/jeewanasaviya-logo.png" alt="Jeewanasaviya" />
        </div>
        <p class="boot-name">ජීවනසවිය</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
