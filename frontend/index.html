<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ජීවනසවිය · Jeewanasaviya</title>
    <!-- Built-in hero slide artwork (desktop only): start downloading before the app boots. -->
    <link rel="preload" as="image" href="/images/hero-gold-card.jpg" media="(min-width: 1024px)" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /*
        One loader for the whole site. The pre-JS boot screen below and React's <PageLoader />
        use these same classes, so the hand-off from HTML to the app is invisible.
      */
      .boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      .boot--full { position: fixed; inset: 0; z-index: 85; background: #fff; }
      .boot--inline { min-height: 45vh; }
      .boot--fade { animation: boot-fade .2s ease-out both; }
      .boot img { width: 112px; height: 112px; object-fit: contain; }
      .boot-track { position: relative; width: 96px; height: 3px; overflow: hidden; border-radius: 3px; background: #e4eaf6; }
      .boot-track::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #c99227; animation: boot-slide 1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-track::after { animation: none; width: 100%; opacity: .6; } }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root">
      <div class="boot boot--full" role="status" aria-label="Loading">
        <img src="/brand/jeewanasaviya-logo.png" alt="" />
        <span class="boot-track"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
