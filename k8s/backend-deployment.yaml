apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-backend
  namespace: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-backend
  template:
    metadata:
      labels:
        app: portal-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/esupporttechnology/jeewana-saviya-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: portal-backend-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: APP_KEY
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/public/tiers
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/tiers
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: portal-backend
  namespace: portal
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: portal-backend
