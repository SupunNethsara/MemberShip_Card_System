apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-frontend
  template:
    metadata:
      labels:
        app: portal-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/esupporttechnology/jeewana-saviya-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: portal-frontend
  namespace: portal
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: portal-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-ingress
  namespace: portal
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - portal.lankacham.com
      secretName: portal-tls
  rules:
    - host: portal.lankacham.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portal-backend
                port:
                  number: 8000
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: portal-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-frontend
                port:
                  number: 80
