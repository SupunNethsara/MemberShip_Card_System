apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-mysql
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-mysql
  template:
    metadata:
      labels:
        app: portal-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              value: membership_portal
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: portal-mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-mysql-pvc
  namespace: portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portal-mysql
  namespace: portal
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: portal-mysql
