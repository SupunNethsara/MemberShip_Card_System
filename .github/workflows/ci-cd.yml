name: CI/CD Pipeline - Deploy to Live & Build Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_portal
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Test Setup
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./backend
        run: |
          composer install --no-progress --prefer-dist --optimize-autoloader --ignore-platform-reqs

      # Frontend Build Setup
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build SPA
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy-cpanel:
    name: Deploy to Live Server (portal.lankacham.com)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, zip
          coverage: none

      - name: Build Production Vendor
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

      - name: Setup Node & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Prepare Backend Zip
        run: |
          cd backend
          zip -rq ../backend_deploy.zip app bootstrap config database resources routes storage vendor artisan -x "*/.git/*" -x "*/tests/*" -x "*/Test/*" -x "storage/logs/*" -x "storage/framework/cache/*" -x "storage/framework/sessions/*"
          cd ..

      - name: Prepare Frontend Zip
        run: |
          cd frontend/dist
          zip -rq ../../frontend_deploy.zip .
          cd ../..

      - name: Deploy via Node.js cPanel Script
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || '49.12.121.200' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || 'lankacham123@lankacham.com' }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS || '' }}
        run: |
          node deploy_cpanel.js

  docker-image-build:
    name: Build & Push Docker Images (GHCR)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
