services:
  database:
    image: mysql:8.0
    container_name: portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: membership_portal
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: portal_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./portal_seeded.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    networks:
      - portal_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_NAME: "Membership Portal"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:dADcR5xVm7b8KaldB7Tj5xv8xamPdkrVPrB3T0Bquao=
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: membership_portal
      DB_USERNAME: portal_user
      DB_PASSWORD: portal_secret_password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - backend_storage:/var/www/html/storage
    ports:
      - "8001:8000"
    networks:
      - portal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - portal_network

volumes:
  mysql_data:
  backend_storage:

networks:
  portal_network:
    driver: bridge
